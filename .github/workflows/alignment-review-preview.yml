name: Alignment Lab review preview
on:
  push:
    branches: [implementation/eigenvector-alignment-lab]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/implementation/eigenvector-alignment-lab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: review/package-lock.json
      - run: npm ci
        working-directory: review
      - run: npx playwright install --with-deps chromium
        working-directory: review
      - run: npm run check
        working-directory: review
      - run: npm run guard:diff
        working-directory: review
        env:
          BASE_REF: 24d7375f5123fd77c2e4a24a707bbf1c5d7497d7
          HEAD_BRANCH: implementation/eigenvector-alignment-lab
      - name: Record review build identity
        working-directory: review
        env:
          IMPLEMENTATION_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module -e 'import {writeFileSync,readFileSync} from "node:fs"; import {createHash} from "node:crypto"; writeFileSync("dist/review-build.json", JSON.stringify({implementationCommit:process.env.IMPLEMENTATION_COMMIT,authoringCommit:"24d7375f5123fd77c2e4a24a707bbf1c5d7497d7",specSha256:createHash("sha256").update(readFileSync("public/experiences/eigenvector-alignment-lab.json")).digest("hex")},null,2))'
      - uses: actions/upload-artifact@v4
        with:
          name: alignment-lab-preview-${{ github.sha }}
          path: review/dist/
          retention-days: 90
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - run: npm ci && npm run build
        working-directory: stable
      - name: Preserve prior commit previews and add this review build
        working-directory: review
        env:
          IMPLEMENTATION_COMMIT: ${{ github.sha }}
        run: npx tsx scripts/review-preview.ts ../stable/dist dist "$IMPLEMENTATION_COMMIT" https://novakai-one.github.io/ai-authored-educational-experiences/previews/eigenvector-alignment-lab/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stable/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}previews/eigenvector-alignment-lab/${{ github.sha }}/?experience=eigenvector-alignment-lab
    steps:
      - name: Deploy review build
        id: deployment
        uses: actions/deploy-pages@v4
